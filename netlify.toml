[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-BqMmADORdj+FPg6TykNcgT+zaeEUgOv9iGxg9ujihxo=' 'sha256-nz7VzC7NG2tNRv3lCV9AYidt/XOs5ZNW8r52g3JJbX8='; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"


[[redirects]]
  from = "/tramo"
  to = "https://tramo.nmclabs.dev/"
  status = 301

[[redirects]]
  from = "/tramo/*"
  to = "https://tramo.nmclabs.dev/:splat"
  status = 301
